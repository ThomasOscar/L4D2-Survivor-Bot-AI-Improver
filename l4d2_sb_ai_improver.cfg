// ================================================================
// 【物品拾取】
// ================================================================

// 启用 bot 物品拾取 (位掩码相加: 1=管道 2=燃烧 4=胆汁 8=医疗包
// 16=除颤器 32=升级包 64=止痛药 128=肾上腺素 256=激光瞄具
