// ================================================================
// 【全局开关】
// ================================================================

// 调试模式 - 在控制台/聊天输出调试信息，会严重卡顿！
// Default: "0"
// Minimum: "0.000000"
// Maximum: "1024.000000"
ib_debug "0"

// bot 数据计算延迟（感染者计数、附近队友等），增大可提高性能但减慢反应
// Default: "0.1"
// Minimum: "0.033000"
ib_process_time "0.1"

// Nightmare 模组适配 - 如果你装了 NIGHTMARE 模组包就开启
// Default: "0"
// Minimum: "0.000000"
// Maximum: "1.000000"
ib_nightmare "0"

// ================================================================
// 【武器偏好】每个角色喜欢用什么主武器
// 0=默认(不干预), 1=步枪, 2=霰弹枪, 3=狙击步枪, 4=SMG, 5=副武器
// ================================================================

// Nick(尼克) 武器偏好
// Default: "1"
// Minimum: "0.000000"
// Maximum: "5.000000"
ib_pref_nick "1"

// Rochelle(萝谢尔) 武器偏好
// Default: "1"
// Minimum: "0.000000"
// Maximum: "5.000000"
ib_pref_rochelle "1"

// Coach(教练) 武器偏好
// Default: "2"
// Minimum: "0.000000"
// Maximum: "5.000000"
ib_pref_coach "2"

// Ellis(埃利斯) 武器偏好
// Default: "3"
// Minimum: "0.000000"
// Maximum: "5.000000"
ib_pref_ellis "3"

// Bill(比尔) 武器偏好
// Default: "1"
// Minimum: "0.000000"
// Maximum: "5.000000"
ib_pref_bill "1"

// Zoey(佐伊) 武器偏好
// Default: "3"
// Minimum: "0.000000"
// Maximum: "5.000000"
ib_pref_zoey "3"

// Francis(弗朗西斯) 武器偏好
// Default: "2"
// Minimum: "0.000000"
// Maximum: "5.000000"
ib_pref_francis "2"

// Louis(路易斯) 武器偏好
// Default: "1"
// Minimum: "0.000000"
// Maximum: "5.000000"
ib_pref_louis "1"

// 所有 bot 只用马格南手枪
// Default: "0"
// Minimum: "0.000000"
// Maximum: "1.000000"
ib_pref_magnums_only "0"

// ================================================================
// 【武器管理】
// ================================================================

// bot 主武器弹药低于此比例时考虑更换武器
// Default: "0.33"
// Minimum: "0.000000"
// Maximum: "1.000000"
ib_hasenoughammo_ratio "0.33"

// T1 武器多样化 - bot 不会全队都拿同一种 T1 武器
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
ib_mix_primaries_t1 "1"

// T2 武器多样化 - bot 换不同子类型的 T2 武器
// Default: "0"
// Minimum: "0.000000"
// Maximum: "1.000000"
ib_mix_primaries_t2 "0"

// 投掷物多样化 - bot 换不同类型的投掷物
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
ib_mix_grenades "1"

// T3 武器(M60/榴弹发射器)是否允许捡弹药
// Default: "0"
// Minimum: "0.000000"
// Maximum: "3.000000"
ib_t3_refill "0"

// 团队 M60 最大数量限制（0=不使用）
// Default: "1"
// Minimum: "0.000000"
ib_t3_limit_m60 "1"

// 团队榴弹发射器最大数量限制（0=不使用）
// Default: "0"
// Minimum: "0.000000"
ib_t3_limit_gl "0"

// bot 避免使用 CSS 武器
// Default: "0"
// Minimum: "0.000000"
// Maximum: "1.000000"
ib_avoid_css "0"

// bot 使用狙击枪时不切换到手枪
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
ib_dontswitchtopistol "1"

// 自定义武器弹药上限覆盖 格式: "weapon_id:ammo_max ..."
// Default: ""
ib_ammotype_override ""

