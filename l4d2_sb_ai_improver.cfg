// 可使用的投掷物类型 (1=管道, 2=燃烧, 4=胆汁, 相加)
// Default: "7"
// Minimum: "1.000000"
// Maximum: "7.000000"
ib_gren_types "7"

// 投掷范围
// Default: "1500"
