// 切换近战所需附近感染者数量
// Default: "4"
// Minimum: "1.000000"
ib_melee_switch_count "4"

// 切换近战的距离范围
// Default: "200"
// Minimum: "0.000000"
ib_melee_switch_range "200"

// 近战接近目标的距离
// Default: "250"
// Minimum: "0.000000"
ib_melee_approach_range "250"

// 近战瞄准距离
// Default: "125"
// Minimum: "0.000000"
ib_melee_aim_range "125"

// 近战攻击距离
// Default: "75"
// Minimum: "0.000000"
ib_melee_attack_range "75"

// 近战时推搡概率（0=禁用）
// Default: "3"
// Minimum: "0.000000"
ib_melee_shove_chance "3"

// 团队电锯最大数量
// Default: "1"
// Minimum: "0.000000"
