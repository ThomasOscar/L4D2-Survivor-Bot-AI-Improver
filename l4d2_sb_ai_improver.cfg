// ================================================================
// 【目标选择】
// ================================================================

// 启用改进的目标选择系统
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
ib_targeting_enabled "1"

// 主武器开火范围
// Default: "1750"
// Minimum: "0.000000"
ib_targeting_range "1750"

// 霰弹枪开火范围
// Default: "750"
// Minimum: "0.000000"
ib_targeting_range_shotgun "750"

// 狙击枪开火范围
// Default: "2500"
// Minimum: "0.000000"
ib_targeting_range_sniperrifle "2500"

// 手枪/副武器开火范围
// Default: "1000"
// Minimum: "0.000000"
ib_targeting_range_pistol "1000"

// 忽略未攻击生还者的普通僵尸
// Default: "1"
// Minimum: "0.000000"
// Maximum: "1.000000"
