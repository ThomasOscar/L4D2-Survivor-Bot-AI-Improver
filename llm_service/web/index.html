<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L4D2 LLM 机器人决策系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Microsoft YaHei','PingFang SC',sans-serif;background:#0f0f0f;color:#e0e0e0;min-height:100vh}
nav{background:#1a1a2e;padding:12px 24px;display:flex;align-items:center;gap:20px;border-bottom:1px solid #333;flex-wrap:wrap}
nav .logo{color:#4fc3f7;font-weight:700;font-size:18px}
nav a{color:#aaa;text-decoration:none;font-size:14px;padding:6px 12px;border-radius:4px;transition:all .2s}
nav a:hover,nav a.active{color:#fff;background:#333}
.container{max-width:1200px;margin:0 auto;padding:20px}
h2{color:#4fc3f7;margin-bottom:16px;font-size:20px}
.card{background:#1a1a2e;border:1px solid #333;border-radius:8px;padding:16px;margin-bottom:12px}
.card h3{color:#4fc3f7;font-size:14px;margin-bottom:8px;letter-spacing:1px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat-item{text-align:center;padding:12px}
.stat-item .value{font-size:28px;font-weight:700;color:#4fc3f7}
.stat-item .label{font-size:12px;color:#888;margin-top:4px}
.hp-bar{height:8px;background:#333;border-radius:4px;overflow:hidden;margin:4px 0}
.hp-bar .fill{height:100%;border-radius:4px;transition:width .3s}
.hp-high{background:#4caf50}.hp-mid{background:#ff9800}.hp-low{background:#f44336}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid #333}
th{color:#4fc3f7;font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600}
.tag-critical{background:#f44336;color:#fff}
.tag-high{background:#ff9800;color:#fff}
.tag-medium{background:#2196f3;color:#fff}
.tag-low{background:#666;color:#fff}
.tag-rule{background:#4caf50;color:#fff}
.tag-llm{background:#9c27b0;color:#fff}
.tag-fallback{background:#795548;color:#fff}
.tag-skipped{background:#555;color:#ccc}
pre{background:#111;border:1px solid #333;border-radius:4px;padding:12px;overflow-x:auto;font-size:12px;line-height:1.5;max-height:500px;overflow-y:auto}
textarea{width:100%;min-height:300px;background:#111;color:#e0e0e0;border:1px solid #333;border-radius:4px;padding:12px;font-family:monospace;font-size:13px;resize:vertical}
button{background:#4fc3f7;color:#000;border:none;padding:8px 20px;border-radius:4px;cursor:pointer;font-weight:600;font-size:14px}
button:hover{background:#81d4fa}
.refresh-btn{float:right;font-size:12px;padding:4px 12px}
#page-content{display:none}
.rating-S{color:#ffd700;font-weight:700}.rating-A{color:#4caf50;font-weight:700}.rating-B{color:#2196f3;font-weight:700}.rating-C{color:#888}.rating-D{color:#f44336;font-weight:700}
.tag-S{background:#ffd700;color:#000}.tag-A{background:#4caf50;color:#fff}.tag-B{background:#2196f3;color:#fff}.tag-C{background:#666;color:#ccc}.tag-D{background:#f44336;color:#fff}
/* 沙盘样式 */
.sandbox-wrap{position:relative;width:100%;aspect-ratio:4/3;background:#0a0a0a;border:1px solid #333;border-radius:8px;overflow:hidden}
.sandbox-wrap canvas{width:100%;height:100%}
.sandbox-legend{display:flex;gap:16px;padding:8px 0;font-size:12px;flex-wrap:wrap}
.sandbox-legend span{display:flex;align-items:center;gap:4px}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
/* AI视角增强 */
.ai-flow{display:flex;gap:8px;align-items:stretch;margin-bottom:12px}
.ai-flow .flow-step{flex:1;background:#1a1a2e;border:1px solid #333;border-radius:8px;padding:12px;text-align:center}
.ai-flow .flow-step.active{border-color:#4fc3f7;box-shadow:0 0 10px rgba(79,195,247,.3)}
.ai-flow .flow-arrow{display:flex;align-items:center;color:#4fc3f7;font-size:24px}
.state-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:768px){.state-grid{grid-template-columns:1fr}.ai-flow{flex-direction:column}.ai-flow .flow-arrow{justify-content:center}}
.state-section{background:#111;border:1px solid #333;border-radius:4px;padding:10px}
.state-section h4{color:#4fc3f7;margin-bottom:6px;font-size:12px}
.state-section .row{display:flex;justify-content:space-between;padding:2px 0;font-size:12px;border-bottom:1px solid #1a1a1a}
.state-section .row:last-child{border:none}
.state-section .key{color:#888}
.state-section .val{color:#e0e0e0;font-weight:500}
.state-section .val.danger{color:#f44336}
.state-section .val.warn{color:#ff9800}
.state-section .val.ok{color:#4caf50}
.collapsible{cursor:pointer;user-select:none}
.collapsible::before{content:'▼ ';font-size:10px}
.collapsible.closed::before{content:'▶ '}
.collapsible.closed+div{display:none}
</style>
</head>
<body>
<nav>
  <div class="logo">L4D2 LLM 机器人</div>
  <a href="#" onclick="showPage('index')" class="active" data-page="index">仪表盘</a>
  <a href="#" onclick="showPage('bot')" data-page="bot">机器人</a>
  <a href="#" onclick="showPage('map')" data-page="map">地图</a>
  <a href="#" onclick="showPage('sandbox')" data-page="sandbox">沙盘</a>
  <a href="#" onclick="showPage('ai-view')" data-page="ai-view">AI 视角</a>
  <a href="#" onclick="showPage('config')" data-page="config">配置</a>
  <a href="#" onclick="showPage('history')" data-page="history">历史</a>
  <a href="#" onclick="showPage('stats')" data-page="stats">统计</a>
  <a href="#" onclick="showPage('scores')" data-page="scores">评分</a>
  <a href="#" onclick="showPage('experience')" data-page="experience">经验</a>
</nav>
<div class="container" id="page-content"></div>

<script>
const API='';
let refreshTimer=null;
const pages={};

// ====== 翻译字典 ======
const T={
  // 角色名
  char:{Nick:'尼克',Rochelle:'罗谢尔',Coach:'教练',Ellis:'埃利斯',Bill:'比尔',Zoey:'佐伊',Francis:'弗朗西斯',Louis:'路易斯'},
  // 武器名（去掉weapon_前缀后的）
  weapon:{
    rifle:'步枪',rifle_ak47:'AK-47',rifle_desert:'沙漠步枪',rifle_m60:'M60',rifle_sg552:'SG552',
    shotgun:'霰弹枪',shotgun_chrome:'铬管霰弹枪',pumpshotgun:'泵动霰弹枪',autoshotgun:'自动霰弹枪',shotgun_spas:'战术霰弹枪',
    sniper_military:'军用狙击枪',sniper_scout:'侦察狙击枪',sniper_awp:'AWP',hunting_rifle:'狩猎步枪',
    smg:'冲锋枪',smg_silenced:'消音冲锋枪',smg_mp5:'MP5',
    pistol:'手枪',pistol_magnum:'马格南手枪',melee:'近战武器',
    grenade_launcher:'榴弹发射器',chainsaw:'电锯',
    first_aid_kit:'急救包',defibrillator:'除颤器',pain_pills:'止痛药',adrenaline:'肾上腺素',
    molotov:'燃烧瓶',pipe_bomb:'管状炸弹',vomitjar:'胆汁瓶',
    gascan:'汽油桶',propanetank:'丙烷罐',oxygentank:'氧气罐',fireworkcrate:'烟花箱',
    ammo_stock:'弹药堆',weapon_ammo_spawner:'弹药箱',
    upgradepack_incendiary:'燃烧弹升级包',upgradepack_explosive:'高爆弹升级包',
    laser_sight:'激光瞄准器',incendiary_ammo:'燃烧弹',explosive_ammo:'高爆弹',
    none:'无','':'无'
  },
  // 动作名
  action:{
    follow_team:'跟随队伍',attack_si:'攻击特感',attack_tank:'集火Tank',attack_witch:'攻击女巫',
    help_teammate:'救助队友',heal_teammate:'治疗队友',evade_threat:'躲避威胁',
    hold_position:'原地防守',throw_grenade:'投掷手雷',pick_up_item:'拾取物品',
    give_item:'给队友物品',cover_fire:'掩护射击',use_defib:'使用除颤器'
  },
  // 特感类型
  si:{smoker:'烟鬼',hunter:'猎人',jockey:'骑乘者',charger:'冲锋者',spitter:'喷吐者',boomer:'呕吐者',tank:'坦克',witch:'女巫',
      hunter_l:'猎人(幽灵)',smoker_l:'烟鬼(幽灵)',jockey_l:'骑乘者(幽灵)',charger_l:'冲锋者(幽灵)',spitter_l:'喷吐者(幽灵)',boomer_l:'呕吐者(幽灵)'},
  // 被控类型
  pin:{smoker:'烟鬼拉扯',hunter:'猎人扑倒',jockey:'骑乘者骑乘',charger:'冲锋者冲撞'},
  // 地图名
  map:{
    c1m1_hotel:'死亡中心-旅馆',c1m2_streets:'死亡中心-街道',c1m3_mall:'死亡中心-商场',c1m4_atrium:'死亡中心-中庭',
    c2m1_highway:'黑色狂欢节-公路',c2m2_fairgrounds:'黑色狂欢节-游乐场',c2m3_coaster:'黑色狂欢节-过山车',c2m4_barns:'黑色狂欢节-谷仓',c2m5_concert:'黑色狂欢节-演唱会',
    c3m1_plankcountry:'沼泽激战-木屋',c3m2_swamp:'沼泽激战-沼泽',c3m3_shantytown:'沼泽激战-棚户区',c3m4_plantation:'沼泽激战-种植园',
    c4m1_milltown_a:'血腥收获-小镇',c4m2_sugarmill_a:'血腥收获-糖厂',c4m3_sugarmill_b:'血腥收获-磨坊',c4m4_milltown_b:'血腥收获-工厂',c4m5_milltown_escape:'血腥收获-撤离',
    c5m1_waterfront:'教区-码头',c5m2_park:'教区-公园',c5m3_cemetery:'教区-墓地',c5m4_quarter:'教区-街区',c5m5_bridge:'教区-大桥',
    c6m1_riverbank:'短暂时刻-河岸',c6m2_passenger:'短暂时刻-渡轮',c6m3_port:'短暂时刻-港口',
    c7m1_docks:'牺牲-码头',c7m2_barge:'牺牲-驳船',c7m3_port:'牺牲-港口',
    c8m1_apartment:'毫不留情-公寓',c8m2_subway:'毫不留情-地铁',c8m3_sewers:'毫不留情-下水道',c8m4_interior:'毫不留情-医院',c8m5_rooftop:'毫不留情-天台',
    c9m1_alleys:'坠机险途-小巷',c9m2_lots:'坠机险途-工地',
    c10m1_caves:'牺牲-洞穴',c10m2_drainage:'牺牲-排水',c10m3_ranchhouse:'牺牲-农场',c10m4_mainstreet:'牺牲-主街',c10m5_houseboat:'牺牲-船屋',
    c11m1_greenhouse:'无人永生-温室',c11m2_offices:'无人永生-办公楼',c11m3_garage:'无人永生-车库',c11m4_terminal:'无人永生-航站楼',c11m5_runway:'无人永生-跑道',
    c12m1_hilltop:'血腥收获-山丘',c12m2_traintunnel:'血腥收获-火车隧道',c12m3_bridge:'血腥收获-桥',c12m4_barn:'血腥收获-谷仓',c12m5_cornfield:'血腥收获-玉米地',
    c13m1_alpinecreek:'临死一博-溪谷',c13m2_southpinestream:'临死一博-溪流',c13m3_muxymill:'临死一博-磨坊',c13m4_cutthecreek:'临死一博-截流',
  },
  // 难度
  diff:{Easy:'简单',Normal:'普通',Hard:'困难',Impossible:'专家'},
  // 游戏模式
  mode:{coop:'合作模式',versus:'对抗模式',survival:'生存模式',realism:'写实模式',scavenge:'搜刮模式',
    mutation1:'出血不止',mutation2:'坦克大战',mutation3:'限定油桶',mutation4:'绝境求生',
    mutation5:'碎尸盛宴',mutation6:'油桶赛跑',mutation7:'侏儒接力',mutation8:'铁人三项',
    mutation9:'最后生还者',mutation10:'无人生还',mutation11:'单人副本',mutation12:'一人一桶',
    mutation13:'仅限一人',mutation14:' bleeding',mutation15:'对抗生存',mutation16:'出血2',
    mutation17:'出血3',mutation18:'出血4',mutation19:'出血5',mutation20:'出血6'},
  // 导演阶段
  director:{relax:'休整',build:'蓄势',peak:'高峰',sustain:'持续'}
};

// 翻译函数
function tr(dict,key){return dict[key]||key}
function trChar(n){return T.char[n]||n}
function trWeapon(w){if(!w||w==='none')return '无';const k=w.replace('weapon_','');return T.weapon[k]||k}
function trAction(a){return T.action[a]||a}
function trSI(t){return T.si[t]||t}
function trPin(t){return T.pin[t]||t||''}
function trMap(m){return T.map[m]||m}
function trDiff(d){return T.diff[d]||d}
function trMode(m){return T.mode[m]||m}
function trDirector(d){return T.director[d]||d}

function showPage(name){
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===name));
  const el=document.getElementById('page-content');
  el.style.display='block';
  if(refreshTimer)clearInterval(refreshTimer);
  if(pages[name])pages[name]();
  refreshTimer=setInterval(()=>{if(pages[name])pages[name]()},3000);
}

async function api(path){
  const r=await fetch(API+path);
  return r.json();
}

function hpClass(hp){return hp>60?'hp-high':hp>30?'hp-mid':'hp-low'}
function hpBar(hp,max=100){return `<div class="hp-bar"><div class="fill ${hpClass(hp)}" style="width:${Math.min(hp/max*100,100)}%"></div></div>`}
function tag(text,cls){return `<span class="tag tag-${cls}">${text}</span>`}
function distColor(d){return d<300?'#f44336':d<800?'#ff9800':'#4caf50'}
function statusLabel(m){return m.pinned?'被控':m.incap?'倒地':'正常'}
function statusClass(m){return m.pinned?'critical':m.incap?'high':'low'}
function sourceLabel(s){return s==='rule'?'规则':s==='llm'?'LLM':s==='fallback'?'回退':s==='skipped'?'跳过':s}
function ghostLabel(g){return g?'幽灵':'实体'}
function angryLabel(a){return a?'暴怒':'平静'}
function outcomeLabel(o){return o==='survived'?'存活':o==='team_wipe'?'团灭':o==='escaped'?'逃脱':o}
function hpValClass(v){return v>60?'ok':v>30?'warn':'danger'}

// 仪表盘
pages.index=async()=>{
  const d=await api('/api/status');
  const s=await api('/api/stats');
  const h=await api('/api/history?count=5');
  let histHtml=h.slice().reverse().map(e=>`<tr><td>${e.time_str}</td><td>${tag(sourceLabel(e.source),e.source)}</td><td>${tag(trAction(e.decision.action),'high')}</td><td style="color:#888;font-size:11px">${e.decision.reason?.slice(0,60)||''}</td></tr>`).join('');
  document.getElementById('page-content').innerHTML=`
    <h2>仪表盘 <button class="refresh-btn" onclick="pages.index()">刷新</button></h2>
    <div class="stat-grid">
      <div class="card stat-item"><div class="value">${trChar(d.bot_name||'?')}</div><div class="label">机器人</div></div>
      <div class="card stat-item"><div class="value" style="color:${hpClass(d.bot_hp||0).replace('hp-','#').replace('high','4caf50').replace('mid','ff9800').replace('low','f44336')}">${d.bot_hp||0}</div><div class="label">生命值</div></div>
      <div class="card stat-item"><div class="value">${d.threats_visible||0}</div><div class="label">可见威胁</div></div>
      <div class="card stat-item"><div class="value" style="font-size:16px">${trMap(d.current_map||'?')}</div><div class="label">当前地图</div></div>
      <div class="card stat-item"><div class="value">${s.rule||0}</div><div class="label">规则决策</div></div>
      <div class="card stat-item"><div class="value">${s.llm||0}</div><div class="label">LLM 决策</div></div>
      <div class="card stat-item"><div class="value">${s.state_unchanged_skipped||0}</div><div class="label">跳过</div></div>
      <div class="card stat-item"><div class="value">${s.avg_api_time_ms||0}ms</div><div class="label">平均 API 耗时</div></div>
    </div>
    <div class="card"><h3>最近决策</h3><table><tr><th>时间</th><th>来源</th><th>动作</th><th>原因</th></tr>${histHtml}</table></div>`;
};

// 机器人
pages.bot=async()=>{
  const d=await api('/api/bot');
  const matesHtml=(d.teammates||[]).map(m=>`<tr><td>${trChar(m.name)}</td><td>${m.hp}${hpBar(m.hp)}</td><td>${tag(statusLabel(m),statusClass(m))}${m.pinned&&m.pin_type?` (${trPin(m.pin_type)})`:''}</td><td style="color:${distColor(m.dist)}">${m.dist?.toFixed(0)||'?'}</td><td>${trWeapon(m.weapon)}</td></tr>`).join('');
  document.getElementById('page-content').innerHTML=`
    <h2>机器人信息</h2>
    <div class="stat-grid">
      <div class="card stat-item"><div class="value">${trChar(d.name||'?')}</div><div class="label">名称</div></div>
      <div class="card stat-item"><div class="value">${d.hp||0}</div><div class="label">生命值</div>${hpBar(d.hp||0)}</div>
      <div class="card stat-item"><div class="value">${d.temp_hp||0}</div><div class="label">临时生命</div></div>
      <div class="card stat-item"><div class="value">${tag(trAction(d.current_action||'?'),d.pinned?'critical':d.incap?'high':'medium')}</div><div class="label">当前动作</div></div>
    </div>
    ${d.pinned?`<div class="card" style="border-color:#f44336"><h3 style="color:#f44336">被控状态</h3><p>被 <strong>${trPin(d.pin_type)||'未知'}</strong> 控制，无法自主行动</p></div>`:''}
    <div class="card"><h3>武器装备</h3>
      <table><tr><th>槽位</th><th>物品</th><th>弹药</th></tr>
        <tr><td>主武器</td><td>${trWeapon(d.weapons?.primary)}</td><td>${d.ammo||0}+${d.reserve||0}</td></tr>
        <tr><td>副武器</td><td>${trWeapon(d.weapons?.secondary)}</td><td>-</td></tr>
        <tr><td>投掷物</td><td>${trWeapon(d.weapons?.grenade)}</td><td>-</td></tr>
        <tr><td>医疗品</td><td>${trWeapon(d.weapons?.health)}</td><td>-</td></tr>
        <tr><td>止痛药</td><td>${trWeapon(d.weapons?.pills)}</td><td>-</td></tr>
      </table>
    </div>
    <div class="card"><h3>队友</h3><table><tr><th>名称</th><th>生命值</th><th>状态</th><th>距离</th><th>主武器</th></tr>${matesHtml}</table></div>
    <div class="card"><h3>当前决策</h3><p><strong>${trAction(d.current_action||'无')}</strong> (${d.current_priority||'?'}) - ${d.current_reason||''}</p></div>`;
};

// 地图
pages.map=async()=>{
  const d=await api('/api/map');
  const thHtml=(d.threats||[]).map(t=>`<tr><td>${trSI(t.type)}</td><td>${t.hp}</td><td style="color:${distColor(t.dist)}">${t.dist?.toFixed(0)||'?'}</td><td>${ghostLabel(t.ghost)}</td></tr>`).join('');
  const wHtml=(d.witches||[]).map(w=>`<tr><td>女巫</td><td>${w.hp}</td><td style="color:${distColor(w.dist)}">${w.dist?.toFixed(0)||'?'}</td><td>${angryLabel(w.angry)}</td></tr>`).join('');
  const iHtml=(d.items||[]).map(i=>`<tr><td>${trWeapon(i.name)}</td><td style="color:${distColor(i.dist)}">${i.dist?.toFixed(0)||'?'}</td></tr>`).join('');
  const t=d.terrain||{};
  document.getElementById('page-content').innerHTML=`
    <h2>地图信息</h2>
    <div class="stat-grid">
      <div class="card stat-item"><div class="value" style="font-size:16px">${trMap(d.map||'?')}</div><div class="label">地图</div></div>
      <div class="card stat-item"><div class="value" style="font-size:16px">${trMode(d.mode||'?')}</div><div class="label">模式</div></div>
      <div class="card stat-item"><div class="value">${trDiff(d.difficulty||'?')}</div><div class="label">难度</div></div>
      <div class="card stat-item"><div class="value">${trDirector(d.director||'?')}</div><div class="label">导演阶段</div></div>
    </div>

function drawSandbox(state,decision){
  const canvas=document.getElementById('sandbox-canvas');
  if(!canvas)return;
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width*2;canvas.height=rect.height*2;
  const ctx=canvas.getContext('2d');
  ctx.scale(2,2);
  const W=rect.width,H=rect.height;
  const cx=W/2,cy=H/2;

  // 背景
  ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);

  // 网格
  ctx.strokeStyle='#1a1a2e';ctx.lineWidth=0.5;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  // 距离圈
  const scale=Math.min(W,H)/2400; // 2400单位 = canvas最短边
  [300,800,1500].forEach(r=>{
    ctx.beginPath();ctx.arc(cx,cy,r*scale,0,Math.PI*2);
    ctx.strokeStyle=r===300?'#f4433640':r===800?'#ff980040':'#4caf5030';
    ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=r===300?'#f44336':r===800?'#ff9800':'#4caf50';
    ctx.font='9px sans-serif';ctx.fillText(r+'u',cx+r*scale+2,cy-2);
  });

  // 地形标记
  const terrain=state.terrain||{};
  if(terrain.narrow){ctx.fillStyle='#ff980030';ctx.fillRect(cx-80,cy-80,160,160);ctx.fillStyle='#ff9800';ctx.font='10px sans-serif';ctx.fillText('狭窄',cx-12,cy-90)}
  if(terrain.ledge){ctx.fillStyle='#f4433630';ctx.fillRect(cx+40,cy-80,120,160);ctx.fillStyle='#f44336';ctx.font='10px sans-serif';ctx.fillText('悬崖',cx+80,cy-90)}
  if(terrain.alarm_car){ctx.fillStyle='#ffd70030';ctx.fillRect(cx-120,cy+40,80,80);ctx.fillStyle='#ffd700';ctx.font='10px sans-serif';ctx.fillText('警报车',cx-115,cy+55)}
  if(terrain.finale){ctx.fillStyle='#9c27b030';ctx.fillRect(0,0,W,H);ctx.fillStyle='#9c27b0';ctx.font='16px sans-serif';ctx.fillText('终局',10,25)}
  if(terrain.crescendo){ctx.fillStyle='#ff572230';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ff5722';ctx.font='16px sans-serif';ctx.fillText('事件',10,45)}

  // 火焰区域
  (state.fire_areas||[]).forEach(f=>{
    const dx=f.dist||f.x||0;const dy=f.dist_y||0;
    ctx.beginPath();ctx.arc(cx+dx*scale,cy+dy*scale,20,0,Math.PI*2);
    ctx.fillStyle='#ff572240';ctx.fill();ctx.strokeStyle='#ff5722';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#ff5722';ctx.font='9px sans-serif';ctx.fillText('火',cx+dx*scale-4,cy+dy*scale+3);
  });
  // 酸液区域
  (state.acid_areas||[]).forEach(a=>{
    const dx=a.dist||a.x||0;const dy=a.dist_y||0;
    ctx.beginPath();ctx.arc(cx+dx*scale,cy+dy*scale,20,0,Math.PI*2);
    ctx.fillStyle='#8bc34a30';ctx.fill();ctx.strokeStyle='#8bc34a';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#8bc34a';ctx.font='9px sans-serif';ctx.fillText('酸',cx+dx*scale-4,cy+dy*scale+3);
  });

  // 物品（黄色菱形）
  (state.items||[]).forEach(item=>{
    const dist=item.dist||0;
    const angle=Math.atan2((item.y||0)-(state.bot?.pos?.[1]||0),(item.x||0)-(state.bot?.pos?.[0]||0));
    const x=cx+Math.cos(angle)*dist*scale;
    const y=cy+Math.sin(angle)*dist*scale;
    if(x<0||x>W||y<0||y>H)return;
    ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);
    ctx.fillStyle='#ff980080';ctx.fillRect(-4,-4,8,8);ctx.restore();
  });

  // 特感（红色三角）
  (state.threats||[]).forEach(t=>{
    const dist=t.dist||0;
    const x=cx+(Math.random()-0.5)*dist*scale;
    const y=cy+(Math.random()-0.5)*dist*scale;
    ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x-6,y+5);ctx.lineTo(x+6,y+5);ctx.closePath();
    ctx.fillStyle=t.ghost?'#f4433640':'#f44336';ctx.fill();
    ctx.fillStyle='#fff';ctx.font='9px sans-serif';ctx.fillText(trSI(t.type),x-10,y+14);
  });

  // 女巫（紫色圆）
  (state.witches||[]).forEach(w=>{
    const dist=w.dist||0;
    const x=cx+(Math.random()-0.5)*dist*scale;
    const y=cy+(Math.random()-0.5)*dist*scale;
    ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);
    ctx.fillStyle=w.angry?'#9c27b0':'#9c27b060';ctx.fill();
    ctx.fillStyle='#fff';ctx.font='9px sans-serif';ctx.fillText(w.angry?'暴怒':'平静',x-10,y+14);
  });

  // 队友（绿色圆）
  (state.teammates||[]).forEach(m=>{
    const dist=m.dist||0;
    const x=cx+(Math.random()-0.5)*dist*scale;
    const y=cy+(Math.random()-0.5)*dist*scale;
    ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);
    ctx.fillStyle=m.pinned?'#f44336':m.incap?'#ff9800':'#4caf50';ctx.fill();
    ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.textAlign='center';
    ctx.fillText(trChar(m.name),x,y-10);
    ctx.fillText(m.hp+'HP',x,y+18);
    ctx.textAlign='left';
  });

  // Bot（蓝色大圆 + 朝向箭头）
  ctx.beginPath();ctx.arc(cx,cy,12,0,Math.PI*2);
  ctx.fillStyle='#4fc3f7';ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  const angles=state.bot?.angles||[0,0];
  const yaw=(angles[0]||0)*Math.PI/180;
  ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.lineTo(cx+Math.cos(yaw)*25,cy+Math.sin(yaw)*25);
  ctx.strokeStyle='#4fc3f7';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.textAlign='center';
  ctx.fillText(trChar(state.bot?.name||'Bot'),cx,cy-18);
  ctx.textAlign='left';

  // 决策箭头
  if(decision.action){
    const actionDir=decision.action.includes('attack')||decision.action==='throw_grenade'?yaw:
                    decision.action==='follow_team'?Math.atan2(Math.random()-0.5,1):yaw+Math.PI;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(actionDir)*40,cy+Math.sin(actionDir)*40);
    ctx.strokeStyle='#ffd700';ctx.lineWidth=3;ctx.setLineDash([6,3]);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#ffd700';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText(trAction(decision.action),cx,cy+30);
    ctx.textAlign='left';
  }

  // 导演阶段
  ctx.fillStyle='#888';ctx.font='10px sans-serif';
  ctx.fillText('导演: '+trDirector(state.director||''),8,H-8);
  ctx.fillText('地图: '+trMap(state.map||''),8,H-22);
}

  document.getElementById('page-content').innerHTML=`
    <h2>配置</h2>
    <div class="card"><h3>系统提示词</h3>
      <textarea id="prompt-editor">${(d.system_prompt||'').replace(/</g,'&lt;')}</textarea>
      <br><br><button onclick="savePrompt()">保存提示词</button>
      <span id="save-status" style="margin-left:12px"></span>
    </div>
    <div class="card"><h3 class="collapsible closed" onclick="this.classList.toggle('closed')">服务配置（JSON）</h3><div><pre>${JSON.stringify(d.config,null,2)}</pre></div></div>`;
};

async function savePrompt(){
  const text=document.getElementById('prompt-editor').value;
  const r=await fetch('/api/config/prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text})});
  const j=await r.json();
  document.getElementById('save-status').textContent=j.status==='ok'?'已保存!':'错误: '+j.error;
  setTimeout(()=>{document.getElementById('save-status').textContent=''},3000);
}

// 历史
pages.history=async()=>{
  const h=await api('/api/history?count=50');
  const rows=h.slice().reverse().map(e=>`<tr><td>${e.time_str}</td><td>${tag(sourceLabel(e.source),e.source)}</td><td>${tag(trAction(e.decision.action),e.decision.priority||'medium')}</td><td style="font-size:11px;color:#888">${e.decision.reason?.slice(0,80)||''}</td><td>${e.elapsed_ms||0}ms</td>
    <td style="font-size:11px">${e.state?.threat_count||0}敌 ${e.state?.pinned_count||0}控</td></tr>`).join('');
  document.getElementById('page-content').innerHTML=`
    <h2>决策历史</h2><div class="card"><table><tr><th>时间</th><th>来源</th><th>动作</th><th>原因</th><th>延迟</th><th>状态</th></tr>${rows}</table></div>`;
};

// 统计
pages.stats=async()=>{
  const s=await api('/api/stats');
  const dist=Object.entries(s.action_distribution||{}).map(([k,v])=>`<tr><td>${trAction(k)}</td><td>${v}</td></tr>`).join('');
  document.getElementById('page-content').innerHTML=`
    <h2>统计数据</h2>
    <div class="stat-grid">
      <div class="card stat-item"><div class="value">${s.rule||0}</div><div class="label">规则 (${s.rule_pct||0}%)</div></div>
      <div class="card stat-item"><div class="value">${s.llm||0}</div><div class="label">LLM (${s.llm_pct||0}%)</div></div>
      <div class="card stat-item"><div class="value">${s.fallback||0}</div><div class="label">回退 (${s.fallback_pct||0}%)</div></div>
      <div class="card stat-item"><div class="value">${s.state_unchanged_skipped||0}</div><div class="label">跳过</div></div>
      <div class="card stat-item"><div class="value">${s.total_decisions||0}</div><div class="label">总计</div></div>
      <div class="card stat-item"><div class="value">${s.avg_api_time_ms||0}ms</div><div class="label">平均 API</div></div>
      <div class="card stat-item"><div class="value">${s.api_timeout||0}</div><div class="label">API 超时</div></div>
      <div class="card stat-item"><div class="value">${s.uptime_seconds||0}s</div><div class="label">运行时间</div></div>
    </div>
    <div class="card"><h3>动作分布</h3><table><tr><th>动作</th><th>次数</th></tr>${dist}</table></div>`;
};

// 评分
pages.scores=async()=>{
  const d=await api('/api/player-scores');
  const players=d.players||[];
  const team=d.team||{};
  const rows=players.map(p=>{
    const rClass=`rating-${p.rating}`;
    const composite=p.composite>=0?`+${p.composite}`:p.composite;
    return `<tr><td>${trChar(p.name)}</td><td class="${rClass}">${tag(p.rating,p.rating)}</td><td>${composite}</td>
      <td style="color:#4caf50">${p.heal}</td><td style="color:#2196f3">${p.revive}</td><td style="color:#ff9800">${p.si_kills}</td>
      <td style="color:#f44336">${p.incap}</td><td style="color:#ff5722">${p.pinned}</td></tr>`;
  }).join('');
  document.getElementById('page-content').innerHTML=`
    <h2>玩家评分</h2>
    <div class="stat-grid">
      <div class="card stat-item"><div class="value">${team.team_score||0}</div><div class="label">团队总分</div></div>
      <div class="card stat-item"><div class="value rating-${team.team_rating||'C'}">${team.team_rating||'C'}</div><div class="label">团队评级</div></div>
      <div class="card stat-item"><div class="value">${trChar(team.mvp||'-')}</div><div class="label">MVP</div></div>
      <div class="card stat-item"><div class="value" style="color:#f44336">${(team.needs_protection||[]).map(n=>trChar(n)).join('、')||'无'}</div><div class="label">需保护</div></div>
    </div>
    <div class="card"><h3>玩家详情</h3>
      <table><tr><th>名称</th><th>评级</th><th>分数</th><th>治疗</th><th>救起</th><th>特感击杀</th><th>倒地</th><th>被控</th></tr>${rows}</table></div>
    ${d.hint?`<div class="card"><h3>AI 建议</h3><p>${d.hint}</p></div>`:''}`;
};

// 经验
pages.experience=async()=>{
  const d=await api('/api/map-experience');
  const exps=d.experiences||[];
  const ms=d.map_stats||{};
  const rows=exps.map(e=>`<tr><td>${tag(trAction(e.action),'medium')}</td><td>${e.target||'-'}</td><td>${tag(outcomeLabel(e.outcome),e.outcome==='survived'?'rule':e.outcome==='team_wipe'?'critical':'low')}</td>
    <td>${e.count}</td><td>${(e.survival_rate*100).toFixed(0)}%</td><td>${e.avg_survival||0}s</td></tr>`).join('');
  document.getElementById('page-content').innerHTML=`
    <h2>地图经验</h2>
    <div class="stat-grid">
      <div class="card stat-item"><div class="value" style="font-size:16px">${trMap(d.current_map||'?')}</div><div class="label">当前地图</div></div>
      <div class="card stat-item"><div class="value">${ms.total_decisions||0}</div><div class="label">总决策数</div></div>
      <div class="card stat-item"><div class="value">${ms.flow_sections||0}</div><div class="label">流程段数</div></div>
      <div class="card stat-item"><div class="value">${(ms.survival_rate||0)*100}%</div><div class="label">存活率</div></div>
      <div class="card stat-item"><div class="value">${(ms.escape_rate||0)*100}%</div><div class="label">逃脱率</div></div>
      <div class="card stat-item"><div class="value" style="color:#f44336">${(ms.team_wipe_rate||0)*100}%</div><div class="label">团灭率</div></div>
    </div>
    <div class="card"><h3>经验记录（当前局势）</h3>${rows?`<table><tr><th>动作</th><th>目标</th><th>结果</th><th>次数</th><th>存活率</th><th>平均存活</th></tr>${rows}</table>`:'<p style="color:#666">当前局势暂无经验记录</p>'}</div>`;
};

// 启动
showPage('index');
</script>
</body>
</html>
