<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L4D2 LLM 机器人决策系统</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Microsoft YaHei','PingFang SC',sans-serif;background:#0f0f0f;color:#e0e0e0;min-height:100vh}
nav{background:#1a1a2e;padding:8px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #333;flex-wrap:wrap}
nav .logo{color:#4fc3f7;font-weight:700;font-size:16px}
nav a{color:#aaa;text-decoration:none;font-size:13px;padding:4px 8px;border-radius:4px;transition:all .2s}
nav a:hover,nav a.active{color:#fff;background:#333}
.container{max-width:1200px;margin:0 auto;padding:12px}
h2{color:#4fc3f7;margin-bottom:10px;font-size:18px}
.card{background:#1a1a2e;border:1px solid #333;border-radius:6px;padding:12px;margin-bottom:8px}
.card h3{color:#4fc3f7;font-size:13px;margin-bottom:6px;letter-spacing:0.5px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat-item{text-align:center;padding:8px}
.stat-item .value{font-size:24px;font-weight:700;color:#4fc3f7}
.stat-item .label{font-size:11px;color:#888;margin-top:2px}
.hp-bar{height:6px;background:#333;border-radius:3px;overflow:hidden;margin:2px 0}
.hp-bar .fill{height:100%;border-radius:3px;transition:width .3s}
.hp-high{background:#4caf50}.hp-mid{background:#ff9800}.hp-low{background:#f44336}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid #222}
th{color:#4fc3f7;font-weight:600;font-size:11px}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600}
.tag-critical{background:#f44336;color:#fff}.tag-high{background:#ff9800;color:#fff}.tag-medium{background:#2196f3;color:#fff}.tag-low{background:#666;color:#fff}
.tag-rule{background:#4caf50;color:#fff}.tag-llm{background:#9c27b0;color:#fff}.tag-fallback{background:#795548;color:#fff}
pre{background:#111;border:1px solid #222;border-radius:4px;padding:8px;overflow-x:auto;font-size:11px;line-height:1.4;max-height:300px;overflow-y:auto}
textarea{width:100%;min-height:200px;background:#111;color:#e0e0e0;border:1px solid #333;border-radius:4px;padding:8px;font-family:monospace;font-size:12px;resize:vertical}
button{background:#4fc3f7;color:#000;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-weight:600;font-size:13px}
button:hover{background:#81d4fa}
.refresh-btn{float:right;font-size:11px;padding:3px 10px}
#page-content{display:none}
.rating-S{color:#ffd700;font-weight:700}.rating-A{color:#4caf50;font-weight:700}.rating-B{color:#2196f3;font-weight:700}.rating-C{color:#888}.rating-D{color:#f44336;font-weight:700}
.tag-S{background:#ffd700;color:#000}.tag-A{background:#4caf50;color:#fff}.tag-B{background:#2196f3;color:#fff}.tag-C{background:#666;color:#ccc}.tag-D{background:#f44336;color:#fff}
.row{display:flex;justify-content:space-between;padding:2px 0;font-size:12px;border-bottom:1px solid #1a1a1a}
.row:last-child{border:none}.row .k{color:#888}.row .v{color:#e0e0e0;font-weight:500}
.row .v.danger{color:#f44336}.row .v.warn{color:#ff9800}.row .v.ok{color:#4caf50}
.collapsible{cursor:pointer;user-select:none}.collapsible::before{content:'▼ ';font-size:9px}
.collapsible.closed::before{content:'▶ '}.collapsible.closed+div{display:none}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:768px){.two-col{grid-template-columns:1fr}}
#sandbox3d{width:100%;height:400px;border:1px solid #333;border-radius:6px;overflow:hidden;position:relative}
#sandbox3d canvas{width:100%!important;height:100%!important}
.legend{display:flex;gap:10px;padding:4px 0;font-size:11px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:3px}
.ld{width:8px;height:8px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<nav>
  <div class="logo">L4D2 LLM</div>
  <a href="#" onclick="showPage('index')" class="active" data-page="index">仪表盘</a>
  <a href="#" onclick="showPage('bot')" data-page="bot">机器人</a>
  <a href="#" onclick="showPage('map')" data-page="map">地图</a>
  <a href="#" onclick="showPage('sandbox')" data-page="sandbox">沙盘</a>
  <a href="#" onclick="showPage('ai_view')" data-page="ai_view">AI视角</a>
  <a href="#" onclick="showPage('config')" data-page="config">配置</a>
  <a href="#" onclick="showPage('history')" data-page="history">历史</a>
  <a href="#" onclick="showPage('stats')" data-page="stats">统计</a>
  <a href="#" onclick="showPage('scores')" data-page="scores">评分</a>
  <a href="#" onclick="showPage('experience')" data-page="experience">经验</a>
</nav>
<div class="container" id="page-content"></div>

<script>
const API='';let refreshTimer=null;const pages={};

// ====== 翻译字典 ======
const T={
  char:{Nick:'尼克',Rochelle:'罗谢尔',Coach:'教练',Ellis:'埃利斯',Bill:'比尔',Zoey:'佐伊',Francis:'弗朗西斯',Louis:'路易斯'},
  weapon:{
    rifle:'步枪',rifle_ak47:'AK-47',rifle_desert:'沙漠步枪',rifle_m60:'M60',rifle_sg552:'SG552',
    shotgun:'霰弹枪',shotgun_chrome:'铬管霰弹',pumpshotgun:'泵动霰弹',autoshotgun:'自动霰弹',shotgun_spas:'战术霰弹',
    sniper_military:'军用狙击',sniper_scout:'侦察狙击',sniper_awp:'AWP',hunting_rifle:'狩猎步枪',
    smg:'冲锋枪',smg_silenced:'消音冲锋',smg_mp5:'MP5',
    pistol:'手枪',pistol_magnum:'马格南',melee:'近战',
    grenade_launcher:'榴弹发射器',chainsaw:'电锯',
    first_aid_kit:'急救包',defibrillator:'除颤器',pain_pills:'止痛药',adrenaline:'肾上腺素',
    molotov:'燃烧瓶',pipe_bomb:'管状炸弹',vomitjar:'胆汁瓶',
    gascan:'汽油桶',propanetank:'丙烷罐',oxygentank:'氧气罐',fireworkcrate:'烟花箱',
    ammo_stock:'弹药堆',none:'无','':'无'
  },
  action:{
    follow_team:'跟随队伍',attack_si:'攻击特感',attack_tank:'集火Tank',attack_witch:'攻击女巫',
    help_teammate:'救助队友',heal_teammate:'治疗队友',evade_threat:'躲避威胁',
    hold_position:'原地防守',throw_grenade:'投掷手雷',pick_up_item:'拾取物品',
    give_item:'给队友物品',cover_fire:'掩护射击',use_defib:'使用除颤器'
  },
  si:{smoker:'烟鬼',hunter:'猎人',jockey:'骑乘者',charger:'冲锋者',spitter:'喷吐者',boomer:'呕吐者',tank:'坦克',witch:'女巫'},
  pin:{smoker:'烟鬼拉扯',hunter:'猎人扑倒',jockey:'骑乘者骑乘',charger:'冲锋者冲撞'},
  map:{
    c1m1_hotel:'死亡中心-旅馆',c1m2_streets:'死亡中心-街道',c1m3_mall:'死亡中心-商场',c1m4_atrium:'死亡中心-中庭',
    c2m1_highway:'黑色狂欢节-公路',c2m2_fairgrounds:'黑色狂欢节-游乐场',c2m3_coaster:'黑色狂欢节-过山车',c2m4_barns:'黑色狂欢节-谷仓',c2m5_concert:'黑色狂欢节-演唱会',
    c3m1_plankcountry:'沼泽激战-木屋',c3m2_swamp:'沼泽激战-沼泽',c3m3_shantytown:'沼泽激战-棚户区',c3m4_plantation:'沼泽激战-种植园',
    c4m1_milltown_a:'血腥收获-小镇',c4m2_sugarmill_a:'血腥收获-糖厂',c4m3_sugarmill_b:'血腥收获-磨坊',c4m4_milltown_b:'血腥收获-工厂',c4m5_milltown_escape:'血腥收获-撤离',
    c5m1_waterfront:'教区-码头',c5m2_park:'教区-公园',c5m3_cemetery:'教区-墓地',c5m4_quarter:'教区-街区',c5m5_bridge:'教区-大桥',
    c6m1_riverbank:'短暂时刻-河岸',c6m2_passenger:'短暂时刻-渡轮',c6m3_port:'短暂时刻-港口',
    c7m1_docks:'牺牲-码头',c7m2_barge:'牺牲-驳船',c7m3_port:'牺牲-港口',
    c8m1_apartment:'毫不留情-公寓',c8m2_subway:'毫不留情-地铁',c8m3_sewers:'毫不留情-下水道',c8m4_interior:'毫不留情-医院',c8m5_rooftop:'毫不留情-天台',
    c9m1_alleys:'坠机险途-小巷',c9m2_lots:'坠机险途-工地',
    c13m1_alpinecreek:'临死一博-溪谷',c13m2_southpinestream:'临死一博-溪流',c13m3_muxymill:'临死一博-磨坊',c13m4_cutthecreek:'临死一博-截流'
  },
  diff:{Easy:'简单',Normal:'普通',Hard:'困难',Impossible:'专家'},
  mode:{coop:'合作',versus:'对抗',survival:'生存',realism:'写实',scavenge:'搜刮',
    mutation1:'出血不止',mutation2:'坦克大战',mutation3:'限定油桶',mutation4:'绝境求生',
    mutation5:'碎尸盛宴',mutation6:'油桶赛跑',mutation7:'侏儒接力',mutation8:'铁人三项',
    mutation9:'最后生还者',mutation10:'无人生还',mutation11:'单人副本',mutation12:'一人一桶',
    mutation13:'仅限一人',mutation15:'对抗生存'},
  director:{relax:'休整',build:'蓄势',peak:'高峰',sustain:'持续'}
};

function tr(d,k){return d[k]||k}
function trChar(n){return T.char[n]||n}
function trWeapon(w){if(!w||w==='none')return'无';return T.weapon[w.replace('weapon_','')]||w.replace('weapon_','')}
function trAction(a){return T.action[a]||a}
function trSI(t){return T.si[t]||t}
function trPin(t){return T.pin[t]||t||''}
function trMap(m){return T.map[m]||m}
function trDiff(d){return T.diff[d]||d}
function trMode(m){return T.mode[m]||m}
function trDirector(d){return T.director[d]||d}

function showPage(name){
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===name));
  const el=document.getElementById('page-content');el.style.display='block';
  if(refreshTimer)clearInterval(refreshTimer);
  if(pages[name])pages[name]();
  refreshTimer=setInterval(()=>{if(pages[name])pages[name]()},3000);
}
async function api(path){const r=await fetch(API+path);return r.json()}
function hpClass(hp){return hp>60?'hp-high':hp>30?'hp-mid':'hp-low'}
function hpBar(hp,max=100){return`<div class="hp-bar"><div class="fill ${hpClass(hp)}" style="width:${Math.min(hp/max*100,100)}%"></div></div>`}
function tag(t,c){return`<span class="tag tag-${c}">${t}</span>`}
function distColor(d){return d<300?'#f44336':d<800?'#ff9800':'#4caf50'}
function statusLabel(m){return m.pinned?'被控':m.incap?'倒地':'正常'}
function statusClass(m){return m.pinned?'critical':m.incap?'high':'low'}
function srcLabel(s){return s==='rule'?'规则':s==='llm'?'LLM':s==='fallback'?'回退':s==='skipped'?'跳过':s}
function ghostL(g){return g?'幽灵':'实体'}
function angryL(a){return a?'暴怒':'平静'}
function outcomeL(o){return o==='survived'?'存活':o==='team_wipe'?'团灭':o==='escaped'?'逃脱':o}
function hpVC(v){return v>60?'ok':v>30?'warn':'danger'}

// ====== 仪表盘 ======
pages.index=async()=>{
  const[d,s,h]=[await api('/api/status'),await api('/api/stats'),await api('/api/history?count=5')];
  const hh=h.slice().reverse().map(e=>`<tr><td>${e.time_str}</td><td>${tag(srcLabel(e.source),e.source)}</td><td>${tag(trAction(e.decision.action),'high')}</td><td style="color:#888;font-size:10px">${e.decision.reason?.slice(0,50)||''}</td></tr>`).join('');
  document.getElementById('page-content').innerHTML=`
    <h2>仪表盘 <button class="refresh-btn" onclick="pages.index()">刷新</button></h2>
    <div class="stat-grid">
      <div class="card stat-item"><div class="value">${trChar(d.bot_name||'?')}</div><div class="label">机器人</div></div>
      <div class="card stat-item"><div class="value" style="color:${hpClass(d.bot_hp||0).replace('hp-','#').replace('high','4caf50').replace('mid','ff9800').replace('low','f44336')}">${d.bot_hp||0}</div><div class="label">生命值</div></div>
      <div class="card stat-item"><div class="value">${d.threats_visible||0}</div><div class="label">威胁</div></div>
      <div class="card stat-item"><div class="value" style="font-size:14px">${trMap(d.current_map||'?')}</div><div class="label">地图</div></div>
      <div class="card stat-item"><div class="value">${s.rule||0}</div><div class="label">规则</div></div>
      <div class="card stat-item"><div class="value">${s.llm||0}</div><div class="label">LLM</div></div>
      <div class="card stat-item"><div class="value">${s.state_unchanged_skipped||0}</div><div class="label">跳过</div></div>
      <div class="card stat-item"><div class="value">${s.avg_api_time_ms||0}ms</div><div class="label">API耗时</div></div>
    </div>
    <div class="card"><h3>最近决策</h3><table><tr><th>时间</th><th>来源</th><th>动作</th><th>原因</th></tr>${hh}</table></div>`;
};

// ====== 机器人 ======
pages.bot=async()=>{
  const d=await api('/api/bot');
  const mH=(d.teammates||[]).map(m=>`<tr><td>${trChar(m.name)}</td><td>${m.hp}${hpBar(m.hp)}</td><td>${tag(statusLabel(m),statusClass(m))}${m.pinned&&m.pin_type?'('+trPin(m.pin_type)+')':''}</td><td style="color:${distColor(m.dist)}">${m.dist?.toFixed(0)||'?'}</td><td>${trWeapon(m.weapon)}</td></tr>`).join('');
  document.getElementById('page-content').innerHTML=`
    <h2>机器人信息</h2>
    <div class="stat-grid">
      <div class="card stat-item"><div class="value">${trChar(d.name||'?')}</div><div class="label">名称</div></div>
      <div class="card stat-item"><div class="value">${d.hp||0}</div><div class="label">生命值</div>${hpBar(d.hp||0)}</div>
      <div class="card stat-item"><div class="value">${d.temp_hp||0}</div><div class="label">临时生命</div></div>
      <div class="card stat-item"><div class="value">${tag(trAction(d.current_action||'?'),d.pinned?'critical':d.incap?'high':'medium')}</div><div class="label">当前动作</div></div>
    </div>
    ${d.pinned?`<div class="card" style="border-color:#f44336"><h3 style="color:#f44336">被控状态</h3><p>被 <strong>${trPin(d.pin_type)||'未知'}</strong> 控制</p></div>`:''}
    <div class="card"><h3>武器装备</h3>
      <table><tr><th>槽位</th><th>物品</th><th>弹药</th></tr>
        <tr><td>主武器</td><td>${trWeapon(d.weapons?.primary)}</td><td>${d.ammo||0}+${d.reserve||0}</td></tr>
        <tr><td>副武器</td><td>${trWeapon(d.weapons?.secondary)}</td><td>-</td></tr>
        <tr><td>投掷物</td><td>${trWeapon(d.weapons?.grenade)}</td><td>-</td></tr>
        <tr><td>医疗品</td><td>${trWeapon(d.weapons?.health)}</td><td>-</td></tr>
        <tr><td>止痛药</td><td>${trWeapon(d.weapons?.pills)}</td><td>-</td></tr>
      </table>
    </div>
    <div class="card"><h3>队友</h3><table><tr><th>名称</th><th>HP</th><th>状态</th><th>距离</th><th>武器</th></tr>${mH}</table></div>
    <div class="card"><h3>当前决策</h3><p><strong>${trAction(d.current_action||'无')}</strong> ${d.current_priority?'('+d.current_priority+')':''} — ${d.current_reason||''}</p></div>
    <div class="card" style="border-color:#555"><h3 style="color:#888">多机器人控制</h3><p style="color:#666;font-size:12px">当前仅支持单机器人控制（由 SourceMod 插件决定控制哪位 Bot）。如需切换控制对象或同时控制全部 Bot，需在 SourceMod 插件端实现多 Bot 轮询或广播机制，属于下一阶段开发内容。</p></div>`;
};

// ====== 地图 ======
pages.map=async()=>{
  const d=await api('/api/map');
  const thH=(d.threats||[]).map(t=>`<tr><td>${trSI(t.type)}</td><td>${t.hp}</td><td style="color:${distColor(t.dist)}">${t.dist?.toFixed(0)||'?'}</td><td>${ghostL(t.ghost)}</td></tr>`).join('');
  const wH=(d.witches||[]).map(w=>`<tr><td>女巫</td><td>${w.hp}</td><td style="color:${distColor(w.dist)}">${w.dist?.toFixed(0)||'?'}</td><td>${angryL(w.angry)}</td></tr>`).join('');
  const iH=(d.items||[]).map(i=>`<tr><td>${trWeapon(i.name)}</td><td style="color:${distColor(i.dist)}">${i.dist?.toFixed(0)||'?'}</td></tr>`).join('');
  const t=d.terrain||{};
  document.getElementById('page-content').innerHTML=`
    <h2>地图信息</h2>
    <div class="stat-grid">
      <div class="card stat-item"><div class="value" style="font-size:14px">${trMap(d.map||'?')}</div><div class="label">地图</div></div>
      <div class="card stat-item"><div class="value" style="font-size:14px">${trMode(d.mode||'?')}</div><div class="label">模式</div></div>
      <div class="card stat-item"><div class="value">${trDiff(d.difficulty||'?')}</div><div class="label">难度</div></div>
      <div class="card stat-item"><div class="value">${trDirector(d.director||'?')}</div><div class="label">导演</div></div>
    </div>
    <div class="card"><h3>地形</h3><p>狭窄:${t.narrow?'是':'否'} 悬崖:${t.ledge?'是':'否'} 警报车:${t.alarm_car?'是':'否'} 事件:${t.crescendo?'是':'否'} 终局:${t.finale?'是':'否'}</p></div>
    <div class="two-col">
      <div class="card"><h3>威胁${(d.threats||[]).length?' ('+(d.threats||[]).length+')':''}</h3>${thH?`<table><tr><th>类型</th><th>HP</th><th>距离</th><th>状态</th></tr>${thH}</table>`:'<p style="color:#555">无可见威胁</p>'}</div>
      <div class="card"><h3>女巫${(d.witches||[]).length?' ('+(d.witches||[]).length+')':''}</h3>${wH?`<table><tr><th>HP</th><th>距离</th><th>状态</th></tr>${wH}</table>`:'<p style="color:#555">无</p>'}</div>
    </div>
    <div class="card"><h3>附近物品 (${(d.items||[]).length})</h3>${iH?`<table><tr><th>物品</th><th>距离</th></tr>${iH}</table>`:'<p style="color:#555">无</p>'}</div>`;
};

// ====== 3D 战术沙盘 ======
let scene3d=null,renderer3d=null,camera3d=null,animId=null;
pages.sandbox=async()=>{
  const d=await api('/api/ai-view');
  const state=d.raw_state||{},decision=d.last_decision||{},bot=state.bot||{};

  document.getElementById('page-content').innerHTML=`
    <h2>3D 战术沙盘 <button class="refresh-btn" onclick="pages.sandbox()">刷新</button></h2>
    <div class="card" style="padding:0;overflow:hidden">
      <div id="sandbox3d"></div>
      <div class="legend" style="padding:6px 10px">
        <span><span class="ld" style="background:#4fc3f7"></span>Bot</span>
        <span><span class="ld" style="background:#4caf50"></span>队友</span>
        <span><span class="ld" style="background:#f44336"></span>特感</span>
        <span><span class="ld" style="background:#9c27b0"></span>女巫</span>
        <span><span class="ld" style="background:#666"></span>普通尸</span>
        <span><span class="ld" style="background:#ff9800"></span>物品</span>
        <span><span class="ld" style="background:#2196f3"></span>枪械</span>
        <span><span class="ld" style="background:#4caf50"></span>医疗</span>
        <span><span class="ld" style="background:#ff5722"></span>火焰</span>
        <span><span class="ld" style="background:#8bc34a"></span>酸液</span>
        <span><span class="ld" style="background:#ffd700"></span>决策</span>
        鼠标拖拽旋转 | 滚轮缩放
      </div>
    </div>
    <div class="two-col">

        <div class="row"><span class="k">武器</span><span class="v">${trWeapon(bot.weapons?.primary)}</span></div>
        <div class="row"><span class="k">被控</span><span class="v ${bot.pinned?'danger':'ok'}">${bot.pinned?trPin(bot.pin_type):'否'}</span></div>
        <div class="row"><span class="k">进度</span><span class="v">${bot.flow||0}</span></div>
      </div>
      <div class="card"><h3>战场</h3>
        <div class="row"><span class="k">地图</span><span class="v">${trMap(state.map||'')}</span></div>
        <div class="row"><span class="k">模式/难度</span><span class="v">${trMode(state.mode||'')} / ${trDiff(state.difficulty||'')}</span></div>
        <div class="row"><span class="k">导演</span><span class="v">${trDirector(state.director||'')}</span></div>
        <div class="row"><span class="k">特感</span><span class="v ${(state.threats||[]).length?'danger':'ok'}">${(state.threats||[]).length}</span></div>
        <div class="row"><span class="k">普通尸</span><span class="v">${state.common_count||0}</span></div>
      </div>
    </div>
    <div class="card"><h3>当前决策</h3>
      <div class="row"><span class="k">动作</span><span class="v" style="color:#ffd700">${trAction(decision.action||'')}</span></div>
      <div class="row"><span class="k">目标</span><span class="v">${decision.target||'-'}</span></div>
      <div class="row"><span class="k">来源</span><span class="v">${srcLabel(d.decision_source||'')}</span></div>
      <div class="row"><span class="k">原因</span><span class="v" style="font-size:11px">${decision.reason||'-'}</span></div>
    </div>`;

  build3D(state,decision);
};

function build3D(state,decision){
  if(animId)cancelAnimationFrame(animId);
  const container=document.getElementById('sandbox3d');
  if(!container)return;
  const W=container.clientWidth,H=container.clientHeight;

  scene3d=new THREE.Scene();
  scene3d.background=new THREE.Color(0x0a0a12);
  scene3d.fog=new THREE.Fog(0x0a0a12,800,2000);

  camera3d=new THREE.PerspectiveCamera(60,W/H,1,5000);
  camera3d.position.set(0,400,500);
  camera3d.lookAt(0,0,0);

  renderer3d=new THREE.WebGLRenderer({antialias:true});
  renderer3d.setSize(W,H);
  renderer3d.setPixelRatio(window.devicePixelRatio);
  container.innerHTML='';
  container.appendChild(renderer3d.domElement);

  // 光照
  scene3d.add(new THREE.AmbientLight(0x404060,1));
  const dl=new THREE.DirectionalLight(0xffffff,0.6);dl.position.set(200,400,200);scene3d.add(dl);

  // 地面
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),new THREE.MeshLambertMaterial({color:0x1a1a2e}));
  ground.rotation.x=-Math.PI/2;scene3d.add(ground);

  // 网格
  const grid=new THREE.GridHelper(3000,30,0x222244,0x111133);scene3d.add(grid);

  // 距离圈
  [300,800,1500].forEach(r=>{
    const c=new THREE.Mesh(new THREE.RingGeometry(r-1,r+1,64),new THREE.MeshBasicMaterial({color:r===300?0xf44336:r===800?0xff9800:0x4caf50,side:THREE.DoubleSide,transparent:true,opacity:0.4}));
    c.rotation.x=-Math.PI/2;c.position.y=1;scene3d.add(c);
  });

  const bot=state.bot||{};
  const yaw=((bot.angles||[])[0]||0)*Math.PI/180;

  // ====== 模型工厂 ======
  function makeBot(x,z,color,name,hp){
    const g=new THREE.Group();
    // 身体
    const body=new THREE.Mesh(new THREE.CylinderGeometry(8,8,20,8),new THREE.MeshLambertMaterial({color}));
    body.position.y=10;g.add(body);
    // 头
    const head=new THREE.Mesh(new THREE.SphereGeometry(6,8,8),new THREE.MeshLambertMaterial({color}));
    head.position.y=24;g.add(head);
    // 名牌
    const canvas=document.createElement('canvas');canvas.width=128;canvas.height=32;
    const ctx=canvas.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,128,32);
    ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.textAlign='center';
    ctx.fillText(name||'?',64,22);
    const tex=new THREE.CanvasTexture(canvas);
    const label=new THREE.Sprite(new THREE.SpriteMaterial({map:tex}));
    label.position.y=36;label.scale.set(40,10,1);g.add(label);
    // HP条
    if(hp!==undefined){
      const bg=new THREE.Mesh(new THREE.PlaneGeometry(20,3),new THREE.MeshBasicMaterial({color:0x333333}));
      bg.position.y=-2;bg.rotation.x=-Math.PI/2;g.add(bg);
      const pct=Math.max(hp/100,0);
      const bar=new THREE.Mesh(new THREE.PlaneGeometry(20*pct,3),new THREE.MeshBasicMaterial({color:hp>60?0x4caf50:hp>30?0xff9800:0xf44336}));
      bar.position.set(-10*(1-pct),-2,0.1);bar.rotation.x=-Math.PI/2;g.add(bar);
    }
    g.position.set(x,0,z);
    scene3d.add(g);return g;
  }

  function makeSI(x,z,type,ghost){
    const color=ghost?0x882222:0xf44336;
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.ConeGeometry(8,18,6),new THREE.MeshLambertMaterial({color,transparent:ghost,opacity:ghost?0.4:1}));
    body.position.y=9;g.add(body);
    // 标签
    const canvas=document.createElement('canvas');canvas.width=128;canvas.height=24;
    const ctx=canvas.getContext('2d');ctx.fillStyle='#f44336';ctx.fillRect(0,0,128,24);
    ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
    ctx.fillText(trSI(type)+(ghost?'(幽灵)':''),64,18);
    const tex=new THREE.CanvasTexture(canvas);
    const label=new THREE.Sprite(new THREE.SpriteMaterial({map:tex}));
    label.position.y=24;label.scale.set(40,8,1);g.add(label);
    g.position.set(x,0,z);scene3d.add(g);return g;
  }

  function makeWitch(x,z,angry){
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.SphereGeometry(10,8,8),new THREE.MeshLambertMaterial({color:angry?0x9c27b0:0x6622aa}));
    body.position.y=8;g.add(body);
    const canvas=document.createElement('canvas');canvas.width=128;canvas.height=24;
    const ctx=canvas.getContext('2d');ctx.fillStyle=angry?0x9c27b0:'#6622aa';ctx.fillRect(0,0,128,24);
    ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
    ctx.fillText(angry?'女巫(暴怒)':'女巫(平静)',64,18);
    const tex=new THREE.CanvasTexture(canvas);
    const label=new THREE.Sprite(new THREE.SpriteMaterial({map:tex}));
    label.position.y=22;label.scale.set(40,8,1);g.add(label);
    g.position.set(x,0,z);scene3d.add(g);return g;
  }

  function makeCommon(x,z){
    const body=new THREE.Mesh(new THREE.BoxGeometry(6,12,6),new THREE.MeshLambertMaterial({color:0x555555}));
    body.position.set(x,6,z);scene3d.add(body);return body;
  }

  function makeItem(x,z,cat){
    const colors={weapon:0x2196f3,health:0x4caf50,grenade:0xff9800,ammo:0x888888,other:0x999999};
    const c=colors[cat]||colors.other;
    const item=new THREE.Mesh(new THREE.BoxGeometry(4,8,4),new THREE.MeshLambertMaterial({color:c,emissive:c,emissiveIntensity:0.3}));
    item.position.set(x,4,z);scene3d.add(item);
    // 发光指示
    const glow=new THREE.PointLight(c,0.5,30);glow.position.set(x,6,z);scene3d.add(glow);
    return item;
  }

  function makeArea(x,z,r,color){
    const a=new THREE.Mesh(new THREE.CircleGeometry(r,16),new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.3,side:THREE.DoubleSide}));
    a.rotation.x=-Math.PI/2;a.position.set(x,0.5,z);scene3d.add(a);return a;
  }

  // Bot
  makeBot(0,0,0x4fc3f7,trChar(bot.name||'Bot'),bot.hp);
  // 朝向箭头
  const arrDir=new THREE.ArrowHelper(new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)).normalize(),new THREE.Vector3(0,15,0),40,0x4fc3f7,8,6);
  scene3d.add(arrDir);

  // 决策箭头(金色)
  if(decision.action){
    const dv=decision.action.includes('attack')||decision.action==='throw_grenade'?
      new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)):
      decision.action==='follow_team'?new THREE.Vector3(0,0,-1):new THREE.Vector3(Math.cos(yaw+Math.PI),0,-Math.sin(yaw+Math.PI));
    const arrDec=new THREE.ArrowHelper(dv.normalize(),new THREE.Vector3(0,25,0),60,0xffd700,10,8);
    scene3d.add(arrDec);
  }

  // 队友
  (state.teammates||[]).forEach((m,i)=>{
    const a=(i*2+1)*Math.PI/4;
    const d=m.dist||50;
    const c=m.pinned?0xf44336:m.incap?0xff9800:0x4caf50;
    makeBot(Math.sin(a)*d,-Math.cos(a)*d,c,trChar(m.name),m.hp);
  });

  // 特感
  (state.threats||[]).forEach((t,i)=>{
    const a=(i+1)*Math.PI*2/Math.max((state.threats||[]).length,1)+0.5;
    const d=t.dist||200;
    makeSI(Math.sin(a)*d,-Math.cos(a)*d,t.type,t.ghost);
  });

  // 女巫
  (state.witches||[]).forEach((w,i)=>{
    const a=(i+3)*Math.PI*0.7;
    const d=w.dist||300;
    makeWitch(Math.sin(a)*d,-Math.cos(a)*d,w.angry);
  });

  // 普通僵尸
  const cc=state.common_count||0;
  for(let i=0;i<Math.min(cc,15);i++){
    const a=Math.random()*Math.PI*2,d=100+Math.random()*400;
    makeCommon(Math.sin(a)*d,-Math.cos(a)*d);
  }

  // 物品
  (state.items||[]).forEach((item,i)=>{
    const a=(i+0.5)*Math.PI*2/Math.max((state.items||[]).length,1);
    const d=item.dist||100;
    const n=item.name||'';
    const cat=n.includes('rifle')||n.includes('shotgun')||n.includes('sniper')||n.includes('smg')||n.includes('pistol')||n.includes('melee')?'weapon':
             n.includes('first_aid')||n.includes('pills')||n.includes('adrenaline')||n.includes('defib')?'health':
             n.includes('molotov')||n.includes('pipe')||n.includes('vomit')?'grenade':'other';
    makeItem(Math.sin(a)*d,-Math.cos(a)*d,cat);
  });

  // 火焰区域
  (state.fire_areas||[]).forEach(f=>makeArea(Math.sin(1)*f.dist||0,-Math.cos(1)*(f.dist||0),30,0xff5722));
  // 酸液区域
  (state.acid_areas||[]).forEach(a=>makeArea(Math.sin(2)*(a.dist||0),-Math.cos(2)*(a.dist||0),25,0x8bc34a));

  // 地形标记
  const t=state.terrain||{};
  if(t.narrow){const w=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshBasicMaterial({color:0xff9800,transparent:true,opacity:0.1,side:THREE.DoubleSide}));w.rotation.x=-Math.PI/2;w.position.y=0.3;scene3d.add(w)}
  if(t.ledge){const l=new THREE.Mesh(new THREE.BoxGeometry(300,4,20),new THREE.MeshLambertMaterial({color:0xf44336,transparent:true,opacity:0.4}));l.position.set(100,2,0);scene3d.add(l)}

  // 鼠标控制
  let isDown=false,prevX=0,prevY=0,rotY=0,rotX=0.6,dist=600;
  container.onmousedown=e=>{isDown=true;prevX=e.clientX;prevY=e.clientY};
  container.onmouseup=()=>isDown=false;
  container.onmouseleave=()=>isDown=false;
  container.onmousemove=e=>{if(!isDown)return;rotY+=(e.clientX-prevX)*0.01;rotX=Math.max(0.1,Math.min(1.5,rotX+(e.clientY-prevY)*0.005));prevX=e.clientX;prevY=e.clientY};
  container.onwheel=e=>{dist=Math.max(200,Math.min(2000,dist+e.deltaY))};

  function animate(){
    animId=requestAnimationFrame(animate);
    camera3d.position.set(Math.sin(rotY)*dist*Math.cos(rotX),Math.sin(rotX)*dist,Math.cos(rotY)*dist*Math.cos(rotX));
    camera3d.lookAt(0,0,0);
    renderer3d.render(scene3d,camera3d);
  }
  animate();
}

      <div class="card stat-item"><div class="value" style="color:#f44336">${(team.needs_protection||[]).map(n=>trChar(n)).join('、')||'无'}</div><div class="label">需保护</div></div>
    </div>
    <div class="card"><h3>详情</h3><table><tr><th>名称</th><th>评级</th><th>分数</th><th>治疗</th><th>救起</th><th>特感杀</th><th>倒地</th><th>被控</th></tr>${rows}</table></div>
    ${d.hint?`<div class="card"><h3>AI 建议</h3><p>${d.hint}</p></div>`:''}`;
};

// ====== 经验 ======
pages.experience=async()=>{
  const d=await api('/api/map-experience');
  const exps=d.experiences||[],ms=d.map_stats||{};
  const rows=exps.map(e=>`<tr><td>${tag(trAction(e.action),'medium')}</td><td>${e.target||'-'}</td><td>${tag(outcomeL(e.outcome),e.outcome==='survived'?'rule':e.outcome==='team_wipe'?'critical':'low')}</td><td>${e.count}</td><td>${(e.survival_rate*100).toFixed(0)}%</td><td>${e.avg_survival||0}s</td></tr>`).join('');
  document.getElementById('page-content').innerHTML=`
    <h2>经验</h2>
    <div class="stat-grid">
      <div class="card stat-item"><div class="value" style="font-size:14px">${trMap(d.map||'?')}</div><div class="label">当前地图</div></div>
      <div class="card stat-item"><div class="value">${ms.total_decisions||0}</div><div class="label">总决策</div></div>
      <div class="card stat-item"><div class="value">${ms.flow_sections||0}</div><div class="label">流程段</div></div>
      <div class="card stat-item"><div class="value">${(ms.survival_rate||0)*100}%</div><div class="label">存活率</div></div>
      <div class="card stat-item"><div class="value">${(ms.escape_rate||0)*100}%</div><div class="label">逃脱率</div></div>
      <div class="card stat-item"><div class="value" style="color:#f44336">${(ms.team_wipe_rate||0)*100}%</div><div class="label">团灭率</div></div>
    </div>
    <div class="card"><h3>经验记录</h3>${rows?`<table><tr><th>动作</th><th>目标</th><th>结果</th><th>次数</th><th>存活率</th><th>平均存活</th></tr>${rows}</table>`:'<p style="color:#555">暂无</p>'}</div>`;
};

// 启动
showPage('index');
</script>
</body>
</html>
