<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L4D2 LLM Bot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#e0e0e0;min-height:100vh}
nav{background:#1a1a2e;padding:12px 24px;display:flex;align-items:center;gap:20px;border-bottom:1px solid #333}
nav .logo{color:#4fc3f7;font-weight:700;font-size:18px}
nav a{color:#aaa;text-decoration:none;font-size:14px;padding:6px 12px;border-radius:4px;transition:all .2s}
nav a:hover,nav a.active{color:#fff;background:#333}
.container{max-width:1200px;margin:0 auto;padding:20px}
h2{color:#4fc3f7;margin-bottom:16px;font-size:20px}
.card{background:#1a1a2e;border:1px solid #333;border-radius:8px;padding:16px;margin-bottom:12px}
.card h3{color:#4fc3f7;font-size:14px;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat-item{text-align:center;padding:12px}
.stat-item .value{font-size:28px;font-weight:700;color:#4fc3f7}
.stat-item .label{font-size:12px;color:#888;margin-top:4px}
.hp-bar{height:8px;background:#333;border-radius:4px;overflow:hidden;margin:4px 0}
.hp-bar .fill{height:100%;border-radius:4px;transition:width .3s}
.hp-high{background:#4caf50}.hp-mid{background:#ff9800}.hp-low{background:#f44336}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid #333}
th{color:#4fc3f7;font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600}
.tag-critical{background:#f44336;color:#fff}
.tag-high{background:#ff9800;color:#fff}
.tag-medium{background:#2196f3;color:#fff}
.tag-low{background:#666;color:#fff}
.tag-rule{background:#4caf50;color:#fff}
.tag-llm{background:#9c27b0;color:#fff}
.tag-fallback{background:#795548;color:#fff}
.tag-skipped{background:#555;color:#ccc}
pre{background:#111;border:1px solid #333;border-radius:4px;padding:12px;overflow-x:auto;font-size:12px;line-height:1.5;max-height:500px;overflow-y:auto}
textarea{width:100%;min-height:300px;background:#111;color:#e0e0e0;border:1px solid #333;border-radius:4px;padding:12px;font-family:monospace;font-size:13px;resize:vertical}
button{background:#4fc3f7;color:#000;border:none;padding:8px 20px;border-radius:4px;cursor:pointer;font-weight:600;font-size:14px}
button:hover{background:#81d4fa}
.refresh-btn{float:right;font-size:12px;padding:4px 12px}
#page-content{display:none}
</style>
</head>
<body>
<nav>
  <div class="logo">L4D2 LLM Bot</div>
  <a href="#" onclick="showPage('index')" class="active" data-page="index">Dashboard</a>
  <a href="#" onclick="showPage('bot')" data-page="bot">Bot</a>
  <a href="#" onclick="showPage('map')" data-page="map">Map</a>
  <a href="#" onclick="showPage('ai-view')" data-page="ai-view">AI View</a>
  <a href="#" onclick="showPage('config')" data-page="config">Config</a>
  <a href="#" onclick="showPage('history')" data-page="history">History</a>
  <a href="#" onclick="showPage('stats')" data-page="stats">Stats</a>
</nav>
<div class="container" id="page-content"></div>

<script>
const API='';
let refreshTimer=null;
const pages={};

function showPage(name){
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===name));
  const el=document.getElementById('page-content');
  el.style.display='block';
  if(refreshTimer)clearInterval(refreshTimer);
  if(pages[name])pages[name]();
  refreshTimer=setInterval(()=>{if(pages[name])pages[name]()},3000);
}

async function api(path){
  const r=await fetch(API+path);
  return r.json();
}

function hpClass(hp){return hp>60?'hp-high':hp>30?'hp-mid':'hp-low'}
function hpBar(hp,max=100){return `<div class="hp-bar"><div class="fill ${hpClass(hp)}" style="width:${Math.min(hp/max*100,100)}%"></div></div>`}
function tag(text,cls){return `<span class="tag tag-${cls}">${text}</span>`}
function distColor(d){return d<300?'#f44336':d<800?'#ff9800':'#4caf50'}

// Dashboard
pages.index=async()=>{
  const d=await api('/api/status');
  const s=await api('/api/stats');
  const h=await api('/api/history?count=5');
  let histHtml=h.slice().reverse().map(e=>`<tr><td>${e.time_str}</td><td>${tag(e.source,e.source)}</td><td>${tag(e.decision.action,'high')}</td><td style="color:#888;font-size:11px">${e.decision.reason?.slice(0,60)||''}</td></tr>`).join('');
  document.getElementById('page-content').innerHTML=`
    <h2>Dashboard <button class="refresh-btn" onclick="pages.index()">Refresh</button></h2>
    <div class="stat-grid">
      <div class="card stat-item"><div class="value">${d.bot_name||'?'}</div><div class="label">Bot</div></div>
      <div class="card stat-item"><div class="value" style="color:${hpClass(d.bot_hp||0).replace('hp-','#').replace('high','4caf50').replace('mid','ff9800').replace('low','f44336')}">${d.bot_hp||0}</div><div class="label">HP</div></div>
      <div class="card stat-item"><div class="value">${d.threats_visible||0}</div><div class="label">Threats</div></div>
      <div class="card stat-item"><div class="value">${d.current_map||'?'}</div><div class="label">Map</div></div>
      <div class="card stat-item"><div class="value">${s.rule||0}</div><div class="label">Rule Decisions</div></div>
      <div class="card stat-item"><div class="value">${s.llm||0}</div><div class="label">LLM Decisions</div></div>
      <div class="card stat-item"><div class="value">${s.state_unchanged_skipped||0}</div><div class="label">Skipped</div></div>
      <div class="card stat-item"><div class="value">${s.avg_api_time_ms||0}ms</div><div class="label">Avg API Time</div></div>
    </div>
    <div class="card"><h3>Recent Decisions</h3><table><tr><th>Time</th><th>Source</th><th>Action</th><th>Reason</th></tr>${histHtml}</table></div>`;
};

// Bot
pages.bot=async()=>{
  const d=await api('/api/bot');
  const matesHtml=(d.teammates||[]).map(m=>`<tr><td>${m.name}</td><td>${m.hp}${hpBar(m.hp)}</td><td>${tag(m.pinned?'PINNED':m.incap?'INCAP':'OK',m.pinned?'critical':m.incap?'high':'low')}</td><td style="color:${distColor(m.dist)}">${m.dist?.toFixed(0)||'?'}</td></tr>`).join('');
  document.getElementById('page-content').innerHTML=`
    <h2>Bot Info</h2>
    <div class="stat-grid">
      <div class="card stat-item"><div class="value">${d.name||'?'}</div><div class="label">Name</div></div>
      <div class="card stat-item"><div class="value">${d.hp||0}</div><div class="label">HP</div>${hpBar(d.hp||0)}</div>
      <div class="card stat-item"><div class="value">${d.temp_hp||0}</div><div class="label">Temp HP</div></div>
      <div class="card stat-item"><div class="value">${tag(d.current_action||'?','high')}</div><div class="label">Action</div></div>
    </div>
    <div class="card"><h3>Weapons</h3>
      <table><tr><th>Slot</th><th>Item</th><th>Ammo</th></tr>
        <tr><td>Primary</td><td>${(d.weapons?.primary||'none').replace('weapon_','')}</td><td>${d.ammo||0}+${d.reserve||0}</td></tr>
        <tr><td>Secondary</td><td>${(d.weapons?.secondary||'none').replace('weapon_','')}</td><td>-</td></tr>
        <tr><td>Grenade</td><td>${(d.weapons?.grenade||'none').replace('weapon_','')}</td><td>-</td></tr>
        <tr><td>Health</td><td>${(d.weapons?.health||'none').replace('weapon_','')}</td><td>-</td></tr>
        <tr><td>Pills</td><td>${(d.weapons?.pills||'none').replace('weapon_','')}</td><td>-</td></tr>
      </table>
    </div>
    <div class="card"><h3>Teammates</h3><table><tr><th>Name</th><th>HP</th><th>Status</th><th>Dist</th></tr>${matesHtml}</table></div>
    <div class="card"><h3>Current Decision</h3><p><strong>${d.current_action||'none'}</strong> (${d.current_priority||'?'}) - ${d.current_reason||''}</p></div>`;
};

// Map
pages.map=async()=>{
  const d=await api('/api/map');
  const thHtml=(d.threats||[]).map(t=>`<tr><td>${t.type}</td><td>${t.hp}</td><td style="color:${distColor(t.dist)}">${t.dist?.toFixed(0)||'?'}</td><td>${t.ghost?'Ghost':'Active'}</td></tr>`).join('');
  const wHtml=(d.witches||[]).map(w=>`<tr><td>Witch</td><td>${w.hp}</td><td style="color:${distColor(w.dist)}">${w.dist?.toFixed(0)||'?'}</td><td>${w.angry?'ANGRY':'Calm'}</td></tr>`).join('');
  const iHtml=(d.items||[]).map(i=>`<tr><td>${i.name.replace('weapon_','')}</td><td style="color:${distColor(i.dist)}">${i.dist?.toFixed(0)||'?'}</td></tr>`).join('');
  const t=d.terrain||{};
  document.getElementById('page-content').innerHTML=`
    <h2>Map Info</h2>
    <div class="stat-grid">
      <div class="card stat-item"><div class="value">${d.map||'?'}</div><div class="label">Map</div></div>
      <div class="card stat-item"><div class="value">${d.mode||'?'}</div><div class="label">Mode</div></div>
      <div class="card stat-item"><div class="value">${d.difficulty||'?'}</div><div class="label">Difficulty</div></div>
    </div>
    <div class="card"><h3>Terrain</h3><p>Narrow: ${t.narrow?'Yes':'No'} | Ledge: ${t.ledge?'Yes':'No'} | Alarm Car: ${t.alarm_car?'Yes':'No'} | Finale: ${t.finale?'Yes':'No'}</p></div>
    <div class="card"><h3>Threats</h3>${thHtml?`<table><tr><th>Type</th><th>HP</th><th>Dist</th><th>Status</th></tr>${thHtml}</table>`:'<p style="color:#666">No threats visible</p>'}</div>
    <div class="card"><h3>Witches</h3>${wHtml?`<table><tr><th>Type</th><th>HP</th><th>Dist</th><th>Status</th></tr>${wHtml}</table>`:'<p style="color:#666">No witches</p>'}</div>
    <div class="card"><h3>Nearby Items</h3>${iHtml?`<table><tr><th>Item</th><th>Dist</th></tr>${iHtml}</table>`:'<p style="color:#666">No items nearby</p>'}</div>
    <div class="card"><h3>Events</h3><p>${(d.events||[]).join(', ')||'None'}</p></div>`;
};

// AI View
pages.ai_view=async()=>{
  const d=await api('/api/ai-view');
  document.getElementById('page-content').innerHTML=`
    <h2>AI View</h2>
    <div class="card"><h3>Raw STATE (what AI sees)</h3><pre>${JSON.stringify(d.raw_state,null,2)}</pre></div>
    <div class="card"><h3>System Prompt</h3><pre>${(d.system_prompt||'').replace(/</g,'&lt;')}</pre></div>
    <div class="card"><h3>User Prompt (latest)</h3><pre>${(d.user_prompt||'').replace(/</g,'&lt;')}</pre></div>
    <div class="card"><h3>Last Decision</h3><pre>${JSON.stringify(d.last_decision,null,2)}</pre></div>`;
};

// Config
pages.config=async()=>{
  const d=await api('/api/config');
  document.getElementById('page-content').innerHTML=`
    <h2>Configuration</h2>
    <div class="card"><h3>System Prompt</h3>
      <textarea id="prompt-editor">${(d.system_prompt||'').replace(/</g,'&lt;')}</textarea>
      <br><br><button onclick="savePrompt()">Save Prompt</button>
      <span id="save-status" style="margin-left:12px"></span>
    </div>
    <div class="card"><h3>Service Config</h3><pre>${JSON.stringify(d.config,null,2)}</pre></div>`;
};

async function savePrompt(){
  const text=document.getElementById('prompt-editor').value;
  const r=await fetch('/api/config/prompt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text})});
  const j=await r.json();
  document.getElementById('save-status').textContent=j.status==='ok'?'Saved!':'Error: '+j.error;
  setTimeout(()=>{document.getElementById('save-status').textContent=''},3000);
}

// History
pages.history=async()=>{
  const h=await api('/api/history?count=50');
  const rows=h.slice().reverse().map(e=>`<tr><td>${e.time_str}</td><td>${tag(e.source,e.source)}</td><td>${tag(e.decision.action,e.decision.priority||'medium')}</td><td style="font-size:11px;color:#888">${e.decision.reason?.slice(0,80)||''}</td><td>${e.elapsed_ms||0}ms</td>
    <td style="font-size:11px">${e.state?.threat_count||0}T ${e.state?.pinned_count||0}P</td></tr>`).join('');
  document.getElementById('page-content').innerHTML=`
    <h2>Decision History</h2><div class="card"><table><tr><th>Time</th><th>Source</th><th>Action</th><th>Reason</th><th>Latency</th><th>State</th></tr>${rows}</table></div>`;
};

// Stats
pages.stats=async()=>{
  const s=await api('/api/stats');
  const dist=Object.entries(s.action_distribution||{}).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  document.getElementById('page-content').innerHTML=`
    <h2>Statistics</h2>
    <div class="stat-grid">
      <div class="card stat-item"><div class="value">${s.rule||0}</div><div class="label">Rule (${s.rule_pct||0}%)</div></div>
      <div class="card stat-item"><div class="value">${s.llm||0}</div><div class="label">LLM (${s.llm_pct||0}%)</div></div>
      <div class="card stat-item"><div class="value">${s.fallback||0}</div><div class="label">Fallback (${s.fallback_pct||0}%)</div></div>
      <div class="card stat-item"><div class="value">${s.state_unchanged_skipped||0}</div><div class="label">Skipped</div></div>
      <div class="card stat-item"><div class="value">${s.total_decisions||0}</div><div class="label">Total</div></div>
      <div class="card stat-item"><div class="value">${s.avg_api_time_ms||0}ms</div><div class="label">Avg API</div></div>
      <div class="card stat-item"><div class="value">${s.api_timeout||0}</div><div class="label">API Timeouts</div></div>
      <div class="card stat-item"><div class="value">${s.uptime_seconds||0}s</div><div class="label">Uptime</div></div>
    </div>
    <div class="card"><h3>Action Distribution</h3><table><tr><th>Action</th><th>Count</th></tr>${dist}</table></div>`;
};

// Init
showPage('index');
</script>
</body>
</html>
