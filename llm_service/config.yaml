# L4D2 LLM Bot 决策服务配置
server:
  host: "0.0.0.0"
  port: 9876

routing:
  strategy: "priority"  # priority / round_robin / adaptive

models:
  - name: "xfyun-astron"
    provider: "openai"
    api_key: "fa89e03abf18b62f1dea56499c6f1b3e:ODM4ZTk2NjA2ZmMwNDU4N2MwZjdhNDcz"
    base_url: "https://maas-coding-api.cn-huabei-1.xf-yun.com/v2"
    model: "astron-code-latest"
    max_tokens: 150
    temperature: 0.3
    timeout: 5.0
    priority: 1
    tier: "lightweight"
    enabled: true

  - name: "ollama-local"
    provider: "ollama"
    api_key: ""
    base_url: "http://localhost:11434"
    model: "llama3.2:latest"
    max_tokens: 80
    temperature: 0.3
    timeout: 45.0
    priority: 2
    tier: "lightweight"
    enabled: true

# Legacy single-model config (backward compat, ignored when models[] is present)
llm:
  provider: "openai"
  api_key: "fa89e03abf18b62f1dea56499c6f1b3e:ODM4ZTk2NjA2ZmMwNDU4N2MwZjdhNDcz"
  base_url: "https://maas-coding-api.cn-huabei-1.xf-yun.com/v2"
  model: "astron-code-latest"
  max_tokens: 150
  temperature: 0.3
  timeout: 5.0

game:
  collect_interval: 1.0
  decision_ttl: 3.0
  fallback_action: "follow_team"

prompt:
  system_prompt_file: "prompts/system.txt"
  max_recent_events: 5
  compress_state: true

debug_server:
  host: "0.0.0.0"
  port: 9877

logging:
  level: "INFO"
